# v13.5.65 (stabilization item 5): the JPX two-market margin balance is the
# D01 input and the credit conditioning of the chart forecast. The committed
# CSV ends 2026-07-10 and nothing imported later weeks, so the 45-day window
# silently dropped the credit features. This job fetches every published week
# after the newest period the ledger holds and imports it through the admin
# route (dry run, then commit), then reads the ledger back. Unpublished weeks
# are reported as gaps, never filled.
name: jpx-credit-weekly

on:
  schedule:
    # 16:45 through 23:45 JST. Weekdays cover holiday-shifted publication.
    # The held period is resolved first; a completed week performs no import.
    - cron: '45 7-14 * * 1-5'
    - cron: '30 10 * * 3-5'  # Existing Wednesday/Thursday/Friday fallback
  workflow_dispatch:
    inputs:
      since:
        description: last period already held (YYYY-MM-DD, exclusive); default = newest in the ledger
        required: false
        default: ''

concurrency:
  group: jpx-credit-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BE: https://argus-backend-3j2m.onrender.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet xlrd==2.0.2 openpyxl==3.1.5
      - name: Resolve the newest credit period the ledger already holds
        id: since
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
          JPX_SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          set -euo pipefail
          since="$JPX_SINCE_INPUT"
          if [ -z "$since" ]; then
            # 2026-09-28: owner authentication gates every read of this host.
            # The existing operational token passes the gate; it is never logged.
            since=$(curl -sf --max-time 120 -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" "$BE/api/argus/market-ledger" | python3 -c '
          import json, sys
          doc = json.load(sys.stdin)
          periods = [str(r.get("periodEnd") or "") for r in doc.get("table") or []
                     if r.get("seriesId") in ("credit.short_balance", "credit.long_balance")]
          best = min(periods) if len(periods) == 2 and all(periods) else "2026-07-10"
          print(best if best >= "2026-07-10" else "2026-07-10")')
          fi
          since=$(JPX_VALIDATE_SINCE="$since" python3 -c 'import os; from datetime import date; print(date.fromisoformat(os.environ["JPX_VALIDATE_SINCE"]).isoformat())')
          echo "since=$since" >> "$GITHUB_OUTPUT"
      - name: Fetch, validate and import the published weeks (token never logged)
        env:
          JPX_SINCE_RESOLVED: ${{ steps.since.outputs.since }}
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B scripts/jpx_credit_weekly.py --since "$JPX_SINCE_RESOLVED" \
            --import --backend "$BE" --summary "$RUNNER_TEMP/jpx-credit-summary.json"
      # The ledger itself is persisted by the existing import route. Its
      # authenticated readback and workbook rows are not public artifacts.
