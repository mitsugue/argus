name: Deploy web/ to GitHub Pages

on:
  push:
    # Deploy only from main. The github-pages environment allows deploys from
    # main (and gh-pages) only, so triggering on a feature branch produced a
    # build that always failed at the deploy step — noisy failure emails for no
    # reason. Feature work reaches Pages by merging/fast-forwarding into main.
    branches:
      - main
    paths:
      - 'web/**'
      - 'product-version.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/actions/warm-profile-*/**'
      - 'release/v13-snapshot-readiness-contract.json'
      - 'web/scripts/release-state-machine.mjs'
      - 'scripts/verify_public_candidate_release.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's recommended Pages pattern: do NOT cancel in-progress deploys —
# cancelling actions/deploy-pages mid-flight leaves the github-pages environment
# with a PENDING deployment that blocks/hangs the next run (the v10.144 cancel:true
# experiment made the timeouts worse). false = let each deploy complete; the build
# job's own concurrency + the 5-min deploy timeout fail closed on a genuine
# infrastructure hang while the last accepted live site remains current.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      backend_deploy: ${{ steps.scope.outputs.backend_deploy }}
      backend_sha: ${{ steps.scope.outputs.backend_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          from scripts.deploy_scope import classify
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          backend = classify(paths)["backendDeploy"]
          print("backend_deploy=" + str(backend).lower())
          print("backend_sha=" + (os.environ["CURRENT_SHA"] if backend else ""))
          PY

  build:
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        env:
          DEPLOY_BASE: /argus/
          VITE_ARGUS_BUILD_SHA: ${{ github.sha }}
          # Wire the ARGUS UI to the live Render backend so the Rates
          # Snapshot / status pill render `live` instead of `mock`. This
          # is also set in web/.env.production (auto-loaded by Vite); the
          # explicit value here makes the wiring visible in CI logs and
          # keeps it working even if that file is absent. Not a secret —
          # it's a public endpoint the client calls directly, and VITE_-
          # prefixed vars are client-exposed by design.
          VITE_ARGUS_BACKEND_URL: https://argus-backend-3j2m.onrender.com
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  backend-infrastructure-readiness:
    needs: [scope, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Record frontend-only infrastructure disposition
        if: needs.scope.outputs.backend_deploy != 'true'
        run: |
          mkdir -p artifacts/backend-infrastructure-readiness
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/backend-infrastructure-readiness/gate.json").write_text(
              json.dumps({
                  "schemaVersion": "argus-v13-infrastructure-readiness-v1",
                  "status": "not_required",
                  "reason": "frontend_only_release",
              }, indent=2) + "\n")
          PY
      - uses: actions/setup-node@v5
        if: needs.scope.outputs.backend_deploy == 'true'
        with:
          node-version: 20
      - name: Wait for exact Render infrastructure (business state may be 0/12)
        if: needs.scope.outputs.backend_deploy == 'true'
        run: |
          node web/scripts/release-state-machine.mjs infrastructure \
            --contract release/v13-snapshot-readiness-contract.json \
            --base-url https://argus-backend-3j2m.onrender.com \
            --expected-sha '${{ needs.scope.outputs.backend_sha }}' \
            --timeout-seconds 900 \
            --poll-seconds 10 \
            --out artifacts/backend-infrastructure-readiness/gate.json
      - name: Publish backend infrastructure readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-infrastructure-readiness-${{ github.sha }}
          path: artifacts/backend-infrastructure-readiness
          if-no-files-found: error
          retention-days: 30

  deploy:
    # Deploy only after the candidate backend is exact.  The public candidate
    # remains unaccepted until the identity barrier and warm-profile jobs pass.
    needs: [build, backend-infrastructure-readiness]
    runs-on: ubuntu-latest
    # One release cycle has one production publication attempt. A failure
    # enters rollback/stop; this workflow never retries the candidate.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  candidate-identity:
    # Deployment API success is not CDN convergence. Poll the actual public
    # index plus healthz/readyz and authorize seeding only for one exact release.
    needs: [scope, deploy, backend-infrastructure-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      product_version: ${{ steps.release.outputs.product_version }}
      frontend_version: ${{ steps.release.outputs.frontend_version }}
      backend_version: ${{ steps.release.outputs.backend_version }}
      backend_sha: ${{ steps.observed.outputs.backend_sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve exact release coordinates
        id: release
        run: |
          python3 -c 'import json; print("product_version=" + json.load(open("product-version.json"))["productVersion"])' >> "$GITHUB_OUTPUT"
          node -p '"frontend_version=" + require("./web/package.json").version' >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("backend_version=" + json.load(open("backend-version.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Wait for exact public frontend and backend candidate identities
        id: gate
        run: |
          python3 -B scripts/verify_public_candidate_release.py \
            --public-url https://mitsugue.github.io/argus/ \
            --backend-url https://argus-backend-3j2m.onrender.com \
            --expected-product-version '${{ steps.release.outputs.product_version }}' \
            --expected-frontend-version '${{ steps.release.outputs.frontend_version }}' \
            --expected-frontend-sha '${{ github.sha }}' \
            --expected-backend-version '${{ steps.release.outputs.backend_version }}' \
            --expected-backend-sha '${{ needs.scope.outputs.backend_sha }}' \
            --timeout-seconds 600 \
            --poll-seconds 10 \
            --output artifacts/public-candidate-identity/gate.json
      - name: Export the exact observed backend identity
        id: observed
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          gate = json.load(open("artifacts/public-candidate-identity/gate.json"))
          health = gate["observed"]["backend"]["health"]
          print("backend_sha=" + health["buildSha"])
          PY
      - name: Publish public candidate identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-candidate-identity-${{ github.sha }}
          path: artifacts/public-candidate-identity
          if-no-files-found: error
          retention-days: 30

  business-snapshot-trigger:
    # The only release producer trigger. It is unreachable until both deployed
    # identities converge, and a busy/duplicate response is never success.
    needs: [candidate-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Trigger and durably acknowledge the exact 12 business snapshots
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          node web/scripts/release-state-machine.mjs trigger-business \
            --contract release/v13-snapshot-readiness-contract.json \
            --base-url https://argus-backend-3j2m.onrender.com \
            --expected-sha '${{ needs.candidate-identity.outputs.backend_sha }}' \
            --trigger-id 'v13-production-${{ github.sha }}-${{ github.run_id }}' \
            --out artifacts/business-snapshot-trigger/trigger.json
      - name: Publish producer trigger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-snapshot-trigger-${{ github.sha }}
          path: artifacts/business-snapshot-trigger
          if-no-files-found: error
          retention-days: 30

  seed-warm-profile:
    # Production-only guard: this job is unreachable until the deployed Pages
    # and Render identities both equal the approved main release.
    needs: [scope, candidate-identity, business-snapshot-trigger]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/warm-profile-seed
        with:
          candidate-sha: ${{ github.sha }}
          public-url: https://mitsugue.github.io/argus/
          profile-artifact-name: market-warm-profile-${{ github.sha }}
          evidence-artifact-name: warm-profile-seed-evidence-${{ github.sha }}
          enforce-public-candidate-identity: 'true'
          expected-product-version: ${{ needs.candidate-identity.outputs.product_version }}
          expected-frontend-version: ${{ needs.candidate-identity.outputs.frontend_version }}
          expected-backend-version: ${{ needs.candidate-identity.outputs.backend_version }}
          expected-backend-sha: ${{ needs.candidate-identity.outputs.backend_sha }}

  business-snapshot-acceptance:
    # R18 is evaluated only after the canonical 1321 / 5D request and warm
    # profile seal, using the same engine and exact producer-trigger binding.
    needs: [candidate-identity, business-snapshot-trigger, seed-warm-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/download-artifact@v5
        with:
          name: business-snapshot-trigger-${{ github.sha }}
          path: artifacts/business-snapshot-trigger
      - name: Accept exactly 12 fresh trigger-bound snapshots
        run: |
          node web/scripts/release-state-machine.mjs verify-business \
            --contract release/v13-snapshot-readiness-contract.json \
            --base-url https://argus-backend-3j2m.onrender.com \
            --expected-sha '${{ needs.candidate-identity.outputs.backend_sha }}' \
            --trigger-artifact artifacts/business-snapshot-trigger/trigger.json \
            --out artifacts/business-snapshot-acceptance/gate.json
      - name: Publish exact-set acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-snapshot-acceptance-${{ github.sha }}
          path: artifacts/business-snapshot-acceptance
          if-no-files-found: error
          retention-days: 30

  public-acceptance:
    needs: [scope, deploy, candidate-identity, seed-warm-profile, business-snapshot-acceptance, backend-infrastructure-readiness]
    # Candidate Pages, exact frontend/backend identity, and warm profile are all
    # independently complete before final product acceptance can begin.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: business-snapshot-acceptance-${{ github.sha }}
          path: artifacts/business-snapshot-acceptance
      - name: Resolve independent release versions
        id: release
        run: |
          node -p '"frontend_version=" + require("./web/package.json").version' >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("backend_version=" + json.load(open("backend-version.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Verify downloaded profile, deployed public URL, and PWA upgrade
        id: market_acceptance
        uses: ./.github/actions/warm-profile-consumer
        with:
          profile-artifact-name: market-warm-profile-${{ github.sha }}
          evidence-artifact-name: market-public-acceptance-${{ github.sha }}
          candidate-sha: ${{ github.sha }}
          public-url: https://mitsugue.github.io/argus/
          mode: accept
          expected-version: ${{ steps.release.outputs.frontend_version }}
          expected-backend-version: ${{ steps.release.outputs.backend_version }}
          expected-backend-sha: ${{ needs.candidate-identity.outputs.backend_sha }}
      - name: Verify mobile Today navigation, geometry, loaders, and 12 snapshots
        id: mobile_acceptance
        working-directory: web
        env:
          ARGUS_PUBLIC_URL: https://mitsugue.github.io/argus/
          ARGUS_EXPECTED_VERSION: ${{ steps.release.outputs.frontend_version }}
          ARGUS_EXPECTED_SHA: ${{ github.sha }}
          ARGUS_MOBILE_ACCEPTANCE_OUT: ../artifacts/market-public-acceptance/mobile-today
        run: node scripts/mobile-today-acceptance.mjs
      - name: Advance the shared engine through public acceptance and V13 live
        run: |
          node web/scripts/release-state-machine.mjs finalize-public \
            --contract release/v13-snapshot-readiness-contract.json \
            --business-artifact artifacts/business-snapshot-acceptance/gate.json \
            --public-artifact artifacts/warm-profile-consumer-evidence/acceptance.json \
            --mobile-artifact artifacts/market-public-acceptance/mobile-today/acceptance.json \
            --expected-sha '${{ github.sha }}' \
            --out artifacts/v13-public-finalization/gate.json
      - name: Report deployment and acceptance outcomes separately
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ needs.deploy.result }}
          MARKET_ACCEPTANCE_OUTCOME: ${{ steps.market_acceptance.outcome }}
          MOBILE_ACCEPTANCE_OUTCOME: ${{ steps.mobile_acceptance.outcome }}
        run: |
          {
            echo "## ARGUS Pages release result"
            echo ""
            echo "- Pages deployment: \`$DEPLOY_OUTCOME\`"
            echo "- Market acceptance: \`$MARKET_ACCEPTANCE_OUTCOME\`"
            echo "- Mobile Today acceptance: \`$MOBILE_ACCEPTANCE_OUTCOME\`"
            echo ""
            echo "Deployment publication and post-deploy acceptance are independent gates."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish reproducible public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-public-acceptance-${{ github.sha }}
          path: artifacts/market-public-acceptance/mobile-today
          if-no-files-found: error
          retention-days: 30
      - name: Publish R19/R20 shared-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-public-finalization-${{ github.sha }}
          path: artifacts/v13-public-finalization
          if-no-files-found: error
          retention-days: 90
