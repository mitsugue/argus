name: breadth-freshness

on:
  schedule:
    # 17:17 JST, Monday-Friday. The runner still verifies the expected
    # trading date because weekday alone does not prove a TSE session.
    - cron: '17 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: breadth-freshness-production
  cancel-in-progress: false

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run duplicate-safe scheduled breadth freshness check
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: >-
          python3 scripts/run_breadth_freshness.py
          --artifact-path "$RUNNER_TEMP/breadth-freshness.json"
          --attempts 3
          --retry-seconds 600
          --poll-seconds 30
          --max-wait-seconds 7200
          > "$RUNNER_TEMP/breadth-freshness.log"
      # 2026-10-18: the evidence goes to the owner's private repository; the
      # public run log keeps only the runner's exit status.
      - name: Store freshness evidence privately
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: python3 -B scripts/private_diagnostics_store.py --kind breadth --run-id "${{ github.run_id }}" "$RUNNER_TEMP/breadth-freshness.json" "$RUNNER_TEMP/breadth-freshness.log"
