# ARGUS runtime diagnostics (v13.5.61, owner request 2026-09-07).
#
# One button for the owner: Actions → runtime-diagnostics → Run workflow.
# It reads the owner-only memory-attribution document WITH the thread-location
# dump (?threads=1) from the production backend and writes a plain summary to
# the run page — which thread is where, what is in flight, how memory phased —
# so a stall or a memory climb can be attributed without a terminal.
#
# The admin token travels only as a request header from the repository secret;
# it is never printed. The dump itself carries locations (file:line:function)
# and scalar counters only — no values, no environment, no owner data.
name: runtime-diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Read the owner-only thread and memory snapshot
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          mkdir -p artifacts/runtime-diagnostics
          code=$(curl -sS -o artifacts/runtime-diagnostics/snapshot.json -w "%{http_code}" \
            --max-time 150 \
            -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
            "https://argus-backend-3j2m.onrender.com/api/argus/admin/memory-attribution?threads=1&inventory=1")
          echo "http=$code"
          test "$code" = "200"
      - name: Read the J-Quants index audit (TOPIX response shape, no rows)
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          # Read-only audit that can take longer than the probe budget; never
          # fail the probe on it (the TOPIX shape was captured on 2026-09-30).
          code=$(curl -sS -o artifacts/runtime-diagnostics/jquants-index-audit.json -w "%{http_code}" \
            --max-time 40 -X POST -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
            "https://argus-backend-3j2m.onrender.com/api/argus/admin/jquants/index-audit" || echo timeout)
          echo "jquants-index-audit http=$code"
      - name: Read the J-Quants dividend fields (13.8 ex-dividend estimate; shape and counts only)
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          # Fiscal-year results peak mid-May and first-quarter results early
          # August; one day of each shows which dividend fields are filled.
          for day in 2026-05-13 2026-08-07 2026-10-02; do
            code=$(curl -sS -o "artifacts/runtime-diagnostics/jquants-dividend-audit-$day.json" -w "%{http_code}" \
              --max-time 60 -X POST -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
              -H 'Content-Type: application/json' --data "{\"date\":\"$day\"}" \
              "https://argus-backend-3j2m.onrender.com/api/argus/admin/jquants/dividend-audit" || echo timeout)
            echo "jquants-dividend-audit $day http=$code"
          done
      - name: Read the issued-forecast record (best effort)
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          code=$(curl -sS -o artifacts/runtime-diagnostics/forecast-track-record.json -w "%{http_code}" \
            --max-time 40 -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
            "https://argus-backend-3j2m.onrender.com/api/argus/market-brief?trackRecord=1" || echo timeout)
          echo "forecast-track-record http=$code"
      - name: Read the delayed intraday Nikkei quote (best effort)
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          code=$(curl -sS -o artifacts/runtime-diagnostics/index-live.json -w "%{http_code}" \
            --max-time 40 -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
            "https://argus-backend-3j2m.onrender.com/api/argus/index-chart?index=N225&live=1" || echo timeout)
          echo "index-live http=$code"
      - name: Read the bridge coverage and the Twelve Data budget
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          # 2026-09-29: deciding whether Twelve Data can drop to the free plan
          # needs the measured split between the moomoo bridge and Twelve Data,
          # not an assumption. Counts and ages only; no symbol list, no secret.
          for sym in 1321 1306 SPY QQQ; do for hz in 1D 5D 20D; do
            code=$(curl -sS -o "artifacts/runtime-diagnostics/snap-$sym-$hz.json" -w "%{http_code}" --max-time 60 \
              -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
              "https://argus-backend-3j2m.onrender.com/api/argus/chart-intelligence?scope=market&symbol=$sym&horizon=$hz&snapshot=verified" || echo timeout)
            echo "verified-snapshot $sym $hz $code"
          done; done
          for name in bridge-status bridge-diagnostic twelvedata-budget provider-diagnostics operational security-status today-headline decision-evidence-a decision-evidence-b index-comparison index-chart market-brief market-brief-history ai-cost cost-policy data-quality sector-heatmap closepin-snapshot memory-snapshot dashboard-events; do
            case "$name" in
              bridge-status) path="/api/argus/bridge/status" ;;
              bridge-diagnostic) path="/api/argus/admin/bridge/diagnostic" ;;
              twelvedata-budget) path="/api/argus/twelvedata-budget" ;;
              provider-diagnostics) path="/api/argus/admin/provider-diagnostics" ;;
              operational) path="/api/argus/admin/diagnostics/operational" ;;
              security-status) path="/api/argus/security-status" ;;
              today-headline) path="/api/argus/today-headline" ;;
              decision-evidence-a) path="/api/argus/decision-evidence?symbols=1321" ;;
              decision-evidence-b) path="/api/argus/decision-evidence?symbol=1321&market=JP&horizon=5D" ;;
              index-comparison) path="/api/argus/index-chart?index=N225&comparison=1&horizon=5" ;;
              market-brief) path="/api/argus/market-brief" ;;
              market-brief-history) path="/api/argus/market-brief?history=1" ;;
              ai-cost) path="/api/argus/ai-cost" ;;
              cost-policy) path="/api/argus/cost-policy" ;;
              sector-heatmap) path="/api/argus/sector-heatmap" ;;
              closepin-snapshot) path="/api/argus/closepin-snapshot" ;;
              memory-snapshot) path="/api/argus/osint/memory-snapshot" ;;
              dashboard-events) path="/api/argus/dashboard-events" ;;
              data-quality) path="/api/argus/data-quality/status" ;;
              index-chart) path="/api/argus/index-chart?index=N225" ;;
            esac
            code=$(curl -sS -o "artifacts/runtime-diagnostics/$name.json" -w "%{http_code}" \
              --max-time 60 -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
              "https://argus-backend-3j2m.onrender.com$path")
            echo "$name http=$code"
          done
          for name in bridge-status bridge-diagnostic twelvedata-budget provider-diagnostics operational security-status today-headline decision-evidence-a decision-evidence-b index-comparison index-chart market-brief market-brief-history ai-cost data-quality; do
            echo "--- $name ---"
            head -c 4000 "artifacts/runtime-diagnostics/$name.json"; echo
          done
      - name: Summarise for the run page
        run: |
          python3 -B scripts/runtime_diagnostics_summary.py \
            artifacts/runtime-diagnostics/snapshot.json >> "$GITHUB_STEP_SUMMARY"
          python3 -B scripts/runtime_diagnostics_summary.py \
            artifacts/runtime-diagnostics/snapshot.json
      - name: Publish the snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-${{ github.run_id }}
          path: artifacts/runtime-diagnostics
          if-no-files-found: error
          retention-days: 14
