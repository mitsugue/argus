# ARGUS runtime diagnostics (v13.5.61, owner request 2026-09-07).
#
# One button for the owner: Actions → runtime-diagnostics → Run workflow.
# It reads the owner-only memory-attribution document WITH the thread-location
# dump (?threads=1) from the production backend and writes a plain summary to
# the run page — which thread is where, what is in flight, how memory phased —
# so a stall or a memory climb can be attributed without a terminal.
#
# The admin token travels only as a request header from the repository secret;
# it is never printed. The dump itself carries locations (file:line:function)
# and scalar counters only — no values, no environment, no owner data.
name: runtime-diagnostics

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # A reviewed repair of this workflow verifies itself once on main.
    paths: ['.github/workflows/runtime-diagnostics.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Read the owner-only thread and memory snapshot
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          mkdir -p artifacts/runtime-diagnostics
          curl -fsS --max-time 30 --max-filesize 262144 \
            "https://argus-backend-3j2m.onrender.com/healthz" \
            -o "$RUNNER_TEMP/runtime-health-before.json"
          code=$(curl -sS -o artifacts/runtime-diagnostics/snapshot.json -w "%{http_code}" \
            --max-time 150 \
            -H "X-ARGUS-ADMIN-TOKEN: $ARGUS_ADMIN_TOKEN" \
            "https://argus-backend-3j2m.onrender.com/api/argus/admin/memory-attribution?threads=1&inventory=1")
          echo "http=$code"
          test "$code" = "200"
          curl -fsS --max-time 30 --max-filesize 262144 \
            "https://argus-backend-3j2m.onrender.com/healthz" \
            -o "$RUNNER_TEMP/runtime-health-after.json"
          curl -fsS --max-time 30 --max-filesize 262144 \
            "https://argus-backend-3j2m.onrender.com/readyz" \
            -o "$RUNNER_TEMP/runtime-ready.json"
          python3 -B - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.runtime_diagnostics_summary import observed_backend_identity
          root = Path(os.environ['RUNNER_TEMP'])
          before, after, ready = [json.loads((root / name).read_text()) for name in
              ('runtime-health-before.json', 'runtime-health-after.json', 'runtime-ready.json')]
          identity = observed_backend_identity(before, after, ready,
              at=datetime.now(timezone.utc).isoformat())
          Path('artifacts/runtime-diagnostics/backend-identity.json').write_text(
              json.dumps(identity, sort_keys=True) + '\n')
          PY
      - name: Summarise privately
        run: |
          python3 -B scripts/runtime_diagnostics_summary.py \
            artifacts/runtime-diagnostics/snapshot.json > artifacts/runtime-diagnostics/summary.txt
      # 2026-10-18: the public repository's logs and artifacts are readable by
      # anyone; the snapshot goes to the owner's private repository only.
      - name: Store the snapshot privately
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: python3 -B scripts/private_diagnostics_store.py --kind runtime --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" artifacts/runtime-diagnostics
