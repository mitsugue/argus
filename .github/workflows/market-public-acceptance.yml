name: Market public acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/market-public-acceptance.yml'
      - 'web/scripts/public-market-acceptance.mjs'
      - 'web/scripts/public-market-acceptance.contract.test.mjs'
      - 'web/scripts/canonical-snapshot-selection.mjs'
      - 'web/scripts/release-state-machine.mjs'
      - 'web/scripts/release-state-machine.test.mjs'
      - 'web/scripts/full-release-simulation.mjs'
      - 'release/v13-snapshot-readiness-contract.json'
      - 'release/v13-accepted-fix-manifest.json'
      - 'web/scripts/mobile-today-acceptance.mjs'
      - 'web/index.html'
      - 'web/src/components/today/ArgusTodayPanel.tsx'
      - 'web/src/lib/verifiedSnapshot.ts'
      - 'web/src/lib/assetChartCache.ts'
      - 'web/src/hooks/useChartIntelligence.ts'
      - 'web/src/lib/snapshotFreshness.ts'
      - 'web/scripts/warm-profile-runtime.mjs'
      - 'web/scripts/warm-profile-runtime.test.mjs'
      - 'web/scripts/run-warm-profile-seed.sh'
      - 'web/scripts/warm-profile-contract.mjs'
      - 'web/scripts/warm-profile-contract.test.mjs'
      - '.github/actions/warm-profile-*/**'
      - '.github/actions/candidate-pages-preview/**'
      - 'docs/ops/v13-final-release-state-machine.md'
      - 'scripts/verify_public_candidate_release.py'
      - 'test_verify_public_candidate_release.py'
      - 'scripts/v13_release_certificate.py'
  workflow_dispatch:
    inputs:
      pages_run_id:
        description: Pages run containing the pre-deploy warm profile
        required: true
        type: string
      frontend_sha:
        description: Exact deployed Pages commit SHA
        required: true
        type: string
      backend_sha:
        description: Exact deployed Render commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  full_release_simulation_1:
    name: full-release-simulation-1
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install pinned simulation browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build exact candidate artifact
        env:
          DEPLOY_BASE: /argus/
          VITE_ARGUS_BACKEND_URL: http://127.0.0.1:4199
          VITE_ARGUS_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build
        working-directory: web
      - name: Full cold-start release simulation 1
        env:
          ARGUS_SIM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/full-release-simulation.mjs --run 1 --out ../artifacts/full-release-simulation-1.json
        working-directory: web
      - name: Publish simulation 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-simulation-1-${{ github.event.pull_request.head.sha }}
          path: artifacts/full-release-simulation-1.json
          if-no-files-found: error
          retention-days: 30

  full_release_simulation_2:
    name: full-release-simulation-2
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install pinned simulation browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build exact candidate artifact
        env:
          DEPLOY_BASE: /argus/
          VITE_ARGUS_BACKEND_URL: http://127.0.0.1:4199
          VITE_ARGUS_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build
        working-directory: web
      - name: Full cold-start release simulation 2
        env:
          ARGUS_SIM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/full-release-simulation.mjs --run 2 --out ../artifacts/full-release-simulation-2.json
        working-directory: web
      - name: Publish simulation 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-release-simulation-2-${{ github.event.pull_request.head.sha }}
          path: artifacts/full-release-simulation-2.json
          if-no-files-found: error
          retention-days: 30

  proof_certificate:
    name: proof-certificate
    if: github.event_name == 'pull_request'
    needs: [full_release_simulation_1, full_release_simulation_2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: full-release-simulation-1-${{ github.event.pull_request.head.sha }}
          path: artifacts/simulation-1
      - uses: actions/download-artifact@v5
        with:
          name: full-release-simulation-2-${{ github.event.pull_request.head.sha }}
          path: artifacts/simulation-2
      - name: Generate content-addressed proof for the exact candidate
        run: |
          python3 -B scripts/v13_release_certificate.py generate \
            --simulation-one artifacts/simulation-1/full-release-simulation-1.json \
            --simulation-two artifacts/simulation-2/full-release-simulation-2.json \
            --ci-status 'full-release-simulation-1=${{ needs.full_release_simulation_1.result }}' \
            --ci-status 'full-release-simulation-2=${{ needs.full_release_simulation_2.result }}' \
            --out artifacts/v13-release-proof/certificate.json
          python3 -B scripts/v13_release_certificate.py verify \
            --certificate artifacts/v13-release-proof/certificate.json
      - name: Publish exact candidate proof certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-release-proof-${{ github.event.pull_request.head.sha }}
          path: artifacts/v13-release-proof/certificate.json
          if-no-files-found: error
          retention-days: 90

  public-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.frontend_sha }}
      - name: Resolve independent release versions
        id: release
        run: |
          node -p '"frontend_version=" + require("./web/package.json").version' >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("backend_version=" + json.load(open("backend-version.json"))["version"])' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/warm-profile-consumer
        with:
          profile-artifact-name: market-warm-profile-${{ inputs.frontend_sha }}
          evidence-artifact-name: market-public-acceptance-${{ inputs.frontend_sha }}
          candidate-sha: ${{ inputs.frontend_sha }}
          public-url: https://mitsugue.github.io/argus/
          mode: accept
          expected-version: ${{ steps.release.outputs.frontend_version }}
          expected-backend-version: ${{ steps.release.outputs.backend_version }}
          expected-backend-sha: ${{ inputs.backend_sha }}
          source-run-id: ${{ inputs.pages_run_id }}
          github-token: ${{ github.token }}
