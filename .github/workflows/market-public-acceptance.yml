name: Market public acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/market-public-acceptance.yml'
      - 'web/scripts/public-market-acceptance.mjs'
      - 'web/scripts/public-market-acceptance.contract.test.mjs'
      - 'web/scripts/warm-profile-runtime.mjs'
      - 'web/scripts/warm-profile-runtime.test.mjs'
      - 'web/scripts/run-warm-profile-seed.sh'
      - 'web/scripts/warm-profile-contract.mjs'
      - 'web/scripts/warm-profile-contract.test.mjs'
      - '.github/actions/warm-profile-*/**'
      - 'scripts/verify_public_candidate_release.py'
      - 'test_verify_public_candidate_release.py'
  workflow_dispatch:
    inputs:
      pages_run_id:
        description: Pages run containing the pre-deploy warm profile
        required: true
        type: string
      frontend_sha:
        description: Exact deployed Pages commit SHA
        required: true
        type: string
      backend_sha:
        description: Exact deployed Render commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  warm-profile-seed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/warm-profile-seed
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha }}
          public-url: https://mitsugue.github.io/argus/
          profile-artifact-name: market-warm-profile-shadow-1-${{ github.event.pull_request.head.sha }}
          evidence-artifact-name: warm-profile-shadow-1-producer-${{ github.event.pull_request.head.sha }}

  warm-profile-handoff:
    if: github.event_name == 'pull_request'
    needs: warm-profile-seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/warm-profile-consumer
        with:
          profile-artifact-name: market-warm-profile-shadow-1-${{ github.event.pull_request.head.sha }}
          evidence-artifact-name: warm-profile-shadow-1-consumer-${{ github.event.pull_request.head.sha }}
          candidate-sha: ${{ github.event.pull_request.head.sha }}
          public-url: https://mitsugue.github.io/argus/
          mode: profile

  warm-profile-seed-2:
    if: github.event_name == 'pull_request'
    needs: warm-profile-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/warm-profile-seed
        with:
          candidate-sha: ${{ github.event.pull_request.head.sha }}
          public-url: https://mitsugue.github.io/argus/
          profile-artifact-name: market-warm-profile-shadow-2-${{ github.event.pull_request.head.sha }}
          evidence-artifact-name: warm-profile-shadow-2-producer-${{ github.event.pull_request.head.sha }}

  warm-profile-handoff-2:
    if: github.event_name == 'pull_request'
    needs: warm-profile-seed-2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/warm-profile-consumer
        with:
          profile-artifact-name: market-warm-profile-shadow-2-${{ github.event.pull_request.head.sha }}
          evidence-artifact-name: warm-profile-shadow-2-consumer-${{ github.event.pull_request.head.sha }}
          candidate-sha: ${{ github.event.pull_request.head.sha }}
          public-url: https://mitsugue.github.io/argus/
          mode: profile

  public-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.frontend_sha }}
      - name: Resolve independent release versions
        id: release
        run: |
          node -p '"frontend_version=" + require("./web/package.json").version' >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("backend_version=" + json.load(open("backend-version.json"))["version"])' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/warm-profile-consumer
        with:
          profile-artifact-name: market-warm-profile-${{ inputs.frontend_sha }}
          evidence-artifact-name: market-public-acceptance-${{ inputs.frontend_sha }}
          candidate-sha: ${{ inputs.frontend_sha }}
          public-url: https://mitsugue.github.io/argus/
          mode: accept
          expected-version: ${{ steps.release.outputs.frontend_version }}
          expected-backend-version: ${{ steps.release.outputs.backend_version }}
          expected-backend-sha: ${{ inputs.backend_sha }}
          source-run-id: ${{ inputs.pages_run_id }}
          github-token: ${{ github.token }}
