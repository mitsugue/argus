name: history-capacity
# 2026-10-20: weekly size of the private history backup. The numbers stay in
# the private repository; the public log only says whether 70% was crossed,
# and a crossing fails the run so GitHub's failure notice reaches the owner.
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: history-capacity
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Measure
        id: measure
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: python3 -B scripts/history_capacity_check.py --output "$RUNNER_TEMP/capacity/capacity.json"
      - name: Store privately
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: |
          [ -d "$RUNNER_TEMP/capacity" ] || exit 0
          python3 -B scripts/private_diagnostics_store.py --kind history-capacity --run-id "${{ github.run_id }}" "$RUNNER_TEMP/capacity"
