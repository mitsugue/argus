# One fixed status read after release 240 collection and its unchanged 180s backup budget.
name: jp-index-readback
on:
  push:
    branches: [codex/jp-index-readback-20261105]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read existing source backup and Tokyo-close status only
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: python3 -B -m scripts.source_backup_readback "$RUNNER_TEMP/readback"
      - name: Preserve fixed fields privately
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: python3 -B scripts/private_diagnostics_store.py --kind jp-index --run-id "${{ github.run_id }}" "$RUNNER_TEMP/readback"
