# ARGUS CI (v9.10) — guards the judgment core on every push.
# Backend: syntax + the pure rule-function unit tests (no network, no keys).
# Frontend: typecheck + production build + a secret-VALUE grep on the bundle.

name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions: {}

jobs:
  backend-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal deps (only what `import scanner` needs)
        run: >-
          pip install --quiet anthropic flask flask-cors requests pytz
          python-dotenv json-repair pytest pytest-xdist==3.8.0 cryptography==49.0.0 pywebpush==2.3.0 webauthn==2.7.1 openpyxl==3.1.5 xlrd==2.0.2
      - name: Syntax check
        run: |
          python -c 'import importlib.metadata as m; assert m.version("cryptography") == "49.0.0"'
          python -m py_compile scanner.py argus_remote_nonce_anchor.py \
            argus_remote_recovery.py argus_rules.py argus_events.py
      - name: Unit tests (rules + events — whole suite auto-discovered)
        # 4 workers; conftest keeps each file on one worker except the few
        # independent long files, whose tests spread (see conftest.py).
        run: python -m pytest -q -n 4 --dist loadgroup

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --prefix web
      - name: Typecheck
        run: npm run lint --prefix web
      - name: Install browser for index identity regression
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: 検査画面の応答本文を追加通信なしで確認
        run: node web/scripts/browser-rate-limit-context.test.mjs
      - name: Check index chart subject isolation
        run: node web/scripts/index-chart-isolation.test.mjs
      - name: 通常復帰で認証と一斉取得を繰り返さない
        run: node web/scripts/app-resume-browser.test.mjs
      - name: Check news presentation hierarchy
        run: node web/scripts/news-presentation.test.mjs
      - name: チャートの指操作と価格表示
        run: node web/scripts/chart-reading-browser.test.mjs
      - name: 条件・イベント・業種の読みやすさ
        run: node web/scripts/decision-reading-browser.test.mjs
      - name: News polling recovery
        run: node web/scripts/news-polling-recovery.test.mjs
      - name: Check historical news reader
        run: node web/scripts/news-history.test.mjs
      - name: Build
        run: DEPLOY_BASE=/argus/ npm run build --prefix web
      - name: Secret-value grep (no sk-/AIza values in the bundle)
        run: |
          if grep -roE "sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}" web/dist/; then
            echo "::error::secret-looking value found in bundle"; exit 1
          fi
          echo "bundle clean"
