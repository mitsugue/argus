name: checkpoint-v2-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/checkpoint-v2-architecture]

permissions:
  contents: read

jobs:
  linux-4gib-cgroup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Production-shaped write, restore and repeated-cycle proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_resource_probe.py \
              --full-cycles 3 --reduced-cycles 50 --assert-bounds \
            | tee artifacts/checkpoint-v2-resource-proof.json
      - name: Publish exact resource proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-resource-proof-${{ github.sha }}
          path: artifacts/checkpoint-v2-resource-proof.json
