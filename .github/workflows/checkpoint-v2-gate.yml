name: checkpoint-v2-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/checkpoint-v2-architecture, "codex/recovery-*"]

permissions:
  contents: read

jobs:
  exact-public-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch one exact public production-shaped state (read-only GET)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 10 \
            --retry-max-time 900 --max-time 300 \
            https://argus-backend-3j2m.onrender.com/api/argus/osint/memory-snapshot \
            --output artifacts/checkpoint-v2-exact-source.json
          python3 -B -c 'import json,pathlib; p=pathlib.Path("artifacts/checkpoint-v2-exact-source.json"); v=json.loads(p.read_text()); assert isinstance(v,dict) and v'
      - name: Publish immutable shared exact state
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts/checkpoint-v2-exact-source.json
          retention-days: 1

  linux-4gib-cgroup:
    needs: exact-public-state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Production-shaped write, restore and repeated-cycle proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_resource_probe.py \
              --full-cycles 3 --retention-cycles 8 --assert-bounds \
            | tee artifacts/checkpoint-v2-resource-proof.json
      - name: Restore shared exact public state
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts
      - name: Exact-state write, restore, WAL and cgroup proof
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_resource_probe.py \
              --source-json artifacts/checkpoint-v2-exact-source.json \
              --full-cycles 1 --retention-cycles 8 --assert-bounds \
            | tee artifacts/checkpoint-v2-exact-resource-proof.json
      - name: Publish exact resource proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-resource-proof-${{ github.sha }}
          path: |
            artifacts/checkpoint-v2-resource-proof.json
            artifacts/checkpoint-v2-exact-resource-proof.json

  mapping-attribution:
    needs: exact-public-state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [pre_fix, candidate_without_trim, candidate_with_trim]
    steps:
      - uses: actions/checkout@v5
      - name: Restore shared exact public state
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts
      - name: Same-shape allocator attribution (${{ matrix.variant }})
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-attribution
          variant='${{ matrix.variant }}'
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_mapping_probe.py \
              --root "/tmp/$variant-root" \
              --raw-dir "/tmp/private-mapping-evidence" \
              --artifact-dir artifacts/mapping-attribution \
              --source-json artifacts/checkpoint-v2-exact-source.json \
              --variant "$variant" --cycles 4 --tracemalloc \
            | tee "artifacts/mapping-attribution/$variant-summary.log"
      - name: Publish redacted mapping attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-mapping-${{ matrix.variant }}-${{ github.sha }}
          path: artifacts/mapping-attribution/

  mapping-syscall-trace:
    needs: exact-public-state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore shared exact public state
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts
      - name: Test-only mmap and munmap trace
        run: |
          set -euo pipefail
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim sh -ceu '
              apt-get update -qq
              apt-get install -y -qq strace >/dev/null
              mkdir -p /tmp/private-strace /tmp/private-mapping-evidence
              strace -ff -ttt -k -yy \
                -e trace=mmap,mmap2,munmap,mremap,brk \
                -o /tmp/private-strace/mmap-trace \
                python3 -B scripts/checkpoint_v2_mapping_probe.py \
                  --root /tmp/trace-root \
                  --raw-dir /tmp/private-mapping-evidence \
                  --artifact-dir artifacts/mapping-attribution/trace \
                  --source-json artifacts/checkpoint-v2-exact-source.json \
                  --variant candidate_with_trim --cycles 3
              python3 -B scripts/summarize_mmap_trace.py \
                --trace-dir /tmp/private-strace \
                --output artifacts/mapping-attribution/mmap-trace-summary.json
            '
      - name: Publish redacted mapping attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-mmap-trace-${{ github.sha }}
          path: artifacts/mapping-attribution/

  mapping-closure-32:
    needs: exact-public-state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore shared exact public state
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts
      - name: Exact 32-cycle single-process mapping closure
        run: |
          set -euo pipefail
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_mapping_probe.py \
              --root /tmp/authoritative-root \
              --raw-dir /tmp/private-mapping-evidence \
              --artifact-dir artifacts/mapping-closure \
              --source-json artifacts/checkpoint-v2-exact-source.json \
              --variant candidate_with_trim --cycles 32 --assert-proof \
            | tee artifacts/checkpoint-v2-32-cycle-mapping-proof.json
      - name: Publish redacted 32-cycle proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-32-cycle-mapping-proof-${{ github.sha }}
          path: |
            artifacts/checkpoint-v2-32-cycle-mapping-proof.json
            artifacts/mapping-closure/

  isolated-writer-closure-32:
    needs: exact-public-state
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Restore shared exact public state
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-v2-exact-source-${{ github.sha }}
          path: artifacts
      - name: Materialize one shared fail-closed isolated proof validator
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/checkpoint-v2-isolated-proof-validator.py <<'PY'
          import json
          import pathlib
          import sys


          LIVE_EXACT_STATE = "LIVE_EXACT_STATE"
          DETERMINISTIC_PRODUCTION_SHAPE = "DETERMINISTIC_PRODUCTION_SHAPE"
          CYCLES = 32
          WAL_DELTA_PER_CYCLE = 17
          CGROUP_MAX_BYTES = 4 * 1024 ** 3
          CGROUP_LIFETIME_PEAK_MAX_BYTES = 3 * 1024 ** 3
          PARENT_RSS_GROWTH_MAX_BYTES = 128 * 1024 ** 2
          DISK_FREE_MIN_BYTES = 1024 ** 3
          PRODUCTION_SHAPE_GENERATION_MIN_BYTES = 127 * 1024 ** 2
          PRODUCTION_SHAPE_GENERATION_MAX_BYTES = 240 * 1024 ** 2
          PRODUCTION_SHAPE_ROWS_MIN = 40_000
          PRODUCTION_SHAPE_ROWS_MAX = 90_000
          PRODUCTION_SHAPE_SECTIONS_MIN = 35
          PRODUCTION_SHAPE_SECTIONS_MAX = 55


          def fail(classification):
              raise SystemExit(classification)


          def exact_int(value):
              return isinstance(value, int) and not isinstance(value, bool)


          def validate_shared(report):
              rows = report.get("cyclesEvidence")
              cycles = report.get("cycles")
              if (cycles != CYCLES or not isinstance(rows, list) or
                      len(rows) != CYCLES or report.get("allVerified") is not True or
                      not all(row.get("verified") is True for row in rows)):
                  fail("isolated_live_or_shape_32_cycles_unverified")
              if (report.get("schemaVersion") !=
                      "argus-checkpoint-v2-isolated-32-cycle-proof-v1" or
                      report.get("writerMode") != "isolated_process"):
                  fail("isolated_live_or_shape_contract_identity_failed")
              if (report.get("distinctChildProcessCount") != CYCLES or
                      report.get("distinctFixtureProcessCount") != CYCLES or
                      report.get("parentPidUnchanged") is not True or
                      report.get("parentNeverLoadedGenerationSource") is not True):
                  fail("isolated_live_or_shape_process_topology_failed")
              original = report.get("originalSourceCursor")
              start = report.get("walStartSequence")
              final = report.get("walFinalSequence")
              targets = [row.get("walTargetSequence") for row in rows]
              lowers = [row.get("walLowerSequence") for row in rows]
              if (not exact_int(original) or original < 0 or
                      not exact_int(start) or start <= 0 or
                      not exact_int(final) or
                      not all(exact_int(value) for value in targets + lowers) or
                      targets != [start + index * WAL_DELTA_PER_CYCLE
                                  for index in range(CYCLES)] or
                      lowers != [target - WAL_DELTA_PER_CYCLE
                                 for target in targets] or
                      final != targets[-1] or
                      report.get("allWalExact") is not True or
                      not all(
                          row.get("walTargetSequence") ==
                          row.get("walReconstructedSequence") and
                          row.get("walHashVerified") is True and
                          row.get("walFramingVerified") is True
                          for row in rows)):
                  fail("isolated_live_or_shape_wal_contract_failed")
              if (report.get("pendingMaximum") != 0 or
                      report.get("retainedMaximum", CYCLES) > 4 or
                      any(row.get("pendingGenerationCount") != 0 or
                          row.get("retainedGenerationCount", CYCLES) > 4
                          for row in rows)):
                  fail("isolated_live_or_shape_generation_retention_failed")
              if (report.get("parentRssCycles3To32GrowthBytes", -1) < 0 or
                      report.get("parentRssCycles3To32GrowthBytes") >
                      PARENT_RSS_GROWTH_MAX_BYTES):
                  fail("isolated_live_or_shape_parent_rss_plateau_failed")
              if (report.get("cgroupMemoryMax") != CGROUP_MAX_BYTES or
                      not exact_int(report.get("cgroupLifetimePeakBytes")) or
                      report.get("cgroupLifetimePeakBytes") <= 0 or
                      report.get("cgroupLifetimePeakBytes") >=
                      CGROUP_LIFETIME_PEAK_MAX_BYTES):
                  fail("isolated_live_or_shape_cgroup_resource_gate_failed")
              if (not exact_int(report.get("diskFreeMinimumBytes")) or
                      report.get("diskFreeMinimumBytes") < DISK_FREE_MIN_BYTES):
                  fail("isolated_live_or_shape_disk_reserve_failed")
              if (report.get("fdGrowth") not in (None, 0) or
                      report.get("threadGrowth") != 0 or
                      report.get("connectionGrowth") != 0 or
                      report.get("cursorGrowth") != 0 or
                      report.get("futureGrowth") != 0 or
                      report.get("zombieFree") is not True or
                      report.get("orphanMaximum") != 0 or
                      any(row.get("stagingOrphanCount") != 0 for row in rows)):
                  fail("isolated_live_or_shape_parent_resource_leak")
              if any(row.get("childExitCode") != 0 for row in rows):
                  fail("isolated_live_or_shape_child_exit_failed")
              if not all(row.get("manifestPromoted") is True for row in rows):
                  fail("isolated_live_or_shape_restore_verification_failed")
              return rows


          def validate(report, mode):
              rows = validate_shared(report)
              if mode == LIVE_EXACT_STATE:
                  original = report.get("originalSourceCursor")
                  if (original <= 0 or report.get("walStartSequence") !=
                          original + WAL_DELTA_PER_CYCLE or
                          not all(row.get("originalSourceCursor") == original
                                  for row in rows)):
                      fail("isolated_live_exact_source_identity_failed")
              elif mode == DETERMINISTIC_PRODUCTION_SHAPE:
                  minimum = report.get("generationBytesMinimum")
                  maximum = report.get("generationBytesMaximum")
                  if (not exact_int(minimum) or not exact_int(maximum) or not
                          (PRODUCTION_SHAPE_GENERATION_MIN_BYTES <= minimum <=
                           maximum <= PRODUCTION_SHAPE_GENERATION_MAX_BYTES)):
                      fail("isolated_deterministic_generation_shape_failed")
                  if not all(
                          exact_int(row.get("rowCount")) and
                          PRODUCTION_SHAPE_ROWS_MIN <= row.get("rowCount") <=
                          PRODUCTION_SHAPE_ROWS_MAX for row in rows):
                      fail("isolated_deterministic_row_shape_failed")
                  if not all(
                          exact_int(row.get("sectionCount")) and
                          PRODUCTION_SHAPE_SECTIONS_MIN <=
                          row.get("sectionCount") <=
                          PRODUCTION_SHAPE_SECTIONS_MAX for row in rows):
                      fail("isolated_deterministic_section_shape_failed")
              else:
                  fail("isolated_proof_mode_invalid")
              return {
                  "mode": mode,
                  "passed": True,
                  "cycles": CYCLES,
                  "generationBytesMinimum": report.get(
                      "generationBytesMinimum"),
                  "generationBytesMaximum": report.get(
                      "generationBytesMaximum"),
                  "rowCountMinimum": min(
                      int(row.get("rowCount") or 0) for row in rows),
                  "rowCountMaximum": max(
                      int(row.get("rowCount") or 0) for row in rows),
                  "sectionCountMinimum": min(
                      int(row.get("sectionCount") or 0) for row in rows),
                  "sectionCountMaximum": max(
                      int(row.get("sectionCount") or 0) for row in rows),
              }


          if len(sys.argv) != 3:
              fail("isolated_proof_validator_arguments_invalid")
          proof_mode = sys.argv[1]
          proof_path = pathlib.Path(sys.argv[2])
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          print(json.dumps(validate(proof, proof_mode), sort_keys=True))
          PY
          python3 -B -m py_compile \
            artifacts/checkpoint-v2-isolated-proof-validator.py
      - name: LIVE_EXACT_STATE 32-cycle fresh-process writer closure
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_isolated_probe.py \
              --source-json artifacts/checkpoint-v2-exact-source.json \
              --cycles 32 \
            | tee artifacts/checkpoint-v2-isolated-live-exact-32-cycle-proof.json
          python3 -B artifacts/checkpoint-v2-isolated-proof-validator.py \
            LIVE_EXACT_STATE \
            artifacts/checkpoint-v2-isolated-live-exact-32-cycle-proof.json \
            | tee artifacts/checkpoint-v2-isolated-live-exact-validation.json
      - name: DETERMINISTIC_PRODUCTION_SHAPE 32-cycle threshold closure
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --memory 4g --memory-swap 4g --pids-limit 512 \
            --volume "$PWD:/work" --workdir /work \
            python:3.12-slim \
            python3 -B scripts/checkpoint_v2_isolated_probe.py \
              --cycles 32 --assert-proof \
            | tee artifacts/checkpoint-v2-isolated-production-shape-32-cycle-proof.json
          python3 -B artifacts/checkpoint-v2-isolated-proof-validator.py \
            DETERMINISTIC_PRODUCTION_SHAPE \
            artifacts/checkpoint-v2-isolated-production-shape-32-cycle-proof.json \
            | tee artifacts/checkpoint-v2-isolated-production-shape-validation.json
      - name: Publish isolated writer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-v2-isolated-32-cycle-proof-${{ github.sha }}
          path: |
            artifacts/checkpoint-v2-isolated-live-exact-32-cycle-proof.json
            artifacts/checkpoint-v2-isolated-live-exact-validation.json
            artifacts/checkpoint-v2-isolated-production-shape-32-cycle-proof.json
            artifacts/checkpoint-v2-isolated-production-shape-validation.json
