# Retired 24/7 individual crypto monitoring. Historical records and the
# admin repair endpoint remain available, but no scheduled scan or provider
# request runs in ordinary operation.
name: crypto-watch

on:
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Scan crypto for shocks (admin-gated)
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          BE="https://argus-backend-3j2m.onrender.com"
          if [ -z "$ARGUS_ADMIN_TOKEN" ]; then
            echo "::warning::ARGUS_ADMIN_TOKEN absent — crypto scan skipped"; exit 0
          fi
          curl -s --max-time 90 "$BE/api/argus/rates" > /dev/null || true   # warm the dyno
          RESP=$(python3 scripts/workflow_http.py --name crypto-scan --method POST --timeout 60 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-value backbone_disabled \
            --url "$BE/api/argus/crypto-scan")
          mkdir -p "$RUNNER_TEMP/private-notes"; printf '%s\n' "$RESP" >> "$RUNNER_TEMP/private-notes"/crypto-scan.txt; echo "crypto-scan: stored privately"
      # 2026-10-18: response bodies go to the owner's private repository;
      # the public run log keeps only that they were stored.
      - name: Store run notes privately
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: |
          [ -d "$RUNNER_TEMP/private-notes" ] || exit 0
          python3 -B scripts/private_diagnostics_store.py --kind crypto --run-id "${{ github.run_id }}" "$RUNNER_TEMP/private-notes"
