name: zz-natural-macro-readback-20261031
on:
  push:
    branches: [codex/natural-macro-readback-20261031]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: 保存済みの結果と現在の固定診断を各一回だけ読む
        env:
          ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,hashlib,datetime
          from pathlib import Path
          p=Path('artifacts/natural-macro-readback');p.mkdir(parents=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect)
          routes=(('health.json','/healthz'),
                  ('memory.json','/api/argus/admin/memory-attribution?threads=1'))
          records=[]
          for name,path in routes:
              record={'name':name,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request('https://argus-backend-3j2m.onrender.com'+path,
                      headers={'X-ARGUS-ADMIN-TOKEN':os.environ['ARGUS_ADMIN_TOKEN']})
                  with opener.open(req,timeout=60) as response:
                      raw=response.read(8*1024*1024+1);assert response.status==200 and len(raw)<=8*1024*1024
                  assert isinstance(json.loads(raw),dict)
                  (p/name).write_bytes(raw)
                  record.update(status=200,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              except Exception as exc:
                  record.update(status='UNOBSERVED',errorClass=type(exc).__name__)
              records.append(record)
          (p/'receipt.json').write_text(json.dumps({'reads':records,'getCount':2,
              'postOrGeneration':0,'newClock':0},indent=2)+'\n')
          print('GET attempted=2; response contents private only')
          PY
      - name: 既存の非公開診断保存へ保全
        if: always()
        env:
          PRIVATE_DIAGNOSTICS_TOKEN: ${{ secrets.ARGUS_PRIVATE_LEDGER_TOKEN }}
        run: python3 -B scripts/private_diagnostics_store.py --kind legacy-readback --run-id "${{ github.run_id }}" artifacts/natural-macro-readback

# 長時間継続した入力準備の終了状態を既存GETで一回確認。

# 新しい入力準備修復の実工程と、既存地図保存版の到着を読取限定で照合。

# 206配信後、通常の30分巡回の開始状態を固定診断だけで照合。収集は起動しない。

# 予定到来後の常駐巡回を一度だけ照合。配信再起動前に進行中かを確認。

# 自然巡回の終端をhealthと固定診断だけで一回照合。比較計算GETは繰り返さない。

# 研究工程に進んだ通常巡回の完了だけを一度確認。保存や収集は起動しない。

# 187の保存済み会社予定接続と金融検証の固定CPU内訳だけを初回読戻し。

# 実検証が完了した時のCPU/経過時間を照合。受入済み会社予定GETは繰り返さない。

# 金融原本の重複SQL読取修復189の初回実時間を固定診断だけで一度照合。

# 修復後の金融検証が終わった時の同じ固定内訳を一度照合。

# 191の金融検証の全バイト検査を保った修復後、同じ固定CPU内訳を一度だけ照合。

# 209の入力準備が進行中の処理位置と金融検証の固定値だけを一回確認。

# 193の採点参照再利用後、同じ固定CPU内訳と入力準備の処理位置を一回照合。

# 193の前回読取は通常処理開始前だった。Pagesの既存業務処理開始後の終端を一度照合。
