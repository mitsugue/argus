# Refresh independent lanes during market hours. Actual executions remain
# subject to the backend policy; a skipped AI call is never an analysis success.
name: ai-rejudge
on:
  schedule:
    - cron: '*/15 0-6 * * 1-5'
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ai-rejudge
  cancel-in-progress: false
jobs:
  rejudge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARGUS_ADMIN_TOKEN: ${{ secrets.ARGUS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Refresh AI judgment
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name ai-rejudge --method POST --timeout 240 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status disabled \
            --expected-status budget_exceeded \
            --expected-status rate_limited \
            --expected-status deterministic_mode \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/ai-judgment/run?checker=flash"
      - name: Refresh event analysis
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name caos-events --method POST --timeout 180 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status deterministic_mode \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/event-analysis/generate"
      - name: Track official event reactions
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name official-events-track --method POST --timeout 90 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status partial \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/official-events/track"
      - name: Refresh entity profiles
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name entity-profiles --method POST --timeout 180 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status deterministic_mode \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/entity-profiles/generate"
      - name: Refresh mover causes
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name mover-causes --method POST --timeout 120 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/admin/mover-causes/refresh"
      - name: Refresh candidate watch list
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name buy-candidates --method POST --timeout 180 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status deterministic_mode \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/buy-candidates/generate"
      - name: Translate queued headlines
        if: ${{ !cancelled() }}
        run: |
          [ -z "$ARGUS_ADMIN_TOKEN" ] && { echo "no admin token — expected_skip"; exit 0; }
          python3 scripts/workflow_http.py --name news-translate --method POST --timeout 90 \
            --header-env X-ARGUS-ADMIN-TOKEN=ARGUS_ADMIN_TOKEN \
            --expected-status deterministic_mode \
            --url "https://argus-backend-3j2m.onrender.com/api/argus/admin/news/translate"
