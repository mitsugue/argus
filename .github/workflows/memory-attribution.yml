          assert cgroup["passed"] is True

          allowed_macro = {
              "schemaVersion", "fixtureVersion", "mode",
              "researchIdentity", "inputIdentity", "artifactId",
              "artifactDigest",
              "workloadDigest", "barCount", "eventCount",
              "artifactBytes", "artifactCapBytes", "eventDetailCount",
