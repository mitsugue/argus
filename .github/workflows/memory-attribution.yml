              "cgroupEnforcementStatus", "memoryMaxBytes",
              "swapMaxBytes", "memoryPeakBytes", "oomDelta",
              "oomKillDelta", "passed",
          }
          assert set(macro) == allowed_macro
          assert all(not isinstance(value, (dict, list, tuple, set))
                     for value in macro.values())
