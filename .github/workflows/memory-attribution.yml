              "overallMemoryPeakBytes": overall_memory_peak,
              "overallOomDelta": overall_oom_delta,
              "overallOomKillDelta": overall_oom_kill_delta,
              "passed": True,
          }
          (root / "round2-truth-ledger-ci-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n",
