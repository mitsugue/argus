          assert macro["artifactId"] == \
              "ra-" + macro["artifactDigest"][:32]
          assert len(macro["workloadDigest"]) == 64
          assert all(char in "0123456789abcdef"
                     for char in macro["workloadDigest"])
          assert macro["researchIdentity"].startswith("rr-")
