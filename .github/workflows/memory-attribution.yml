          overall_memory_peak = scalar("round2-macro-memory-peak.txt")
          assert overall_memory_max == 4294967296
          assert overall_swap_max == 0
          assert overall_memory_peak < overall_memory_max
          assert overall_oom_delta == 0
          assert overall_oom_kill_delta == 0

          proof = {
