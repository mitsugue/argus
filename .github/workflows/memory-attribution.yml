          def scalar(name):
              return int((root / name).read_text(encoding="ascii").strip())

          def events(name):
              return {
                  key: int(value)
                  for key, value in (
                      line.split() for line in (
                          root / name).read_text(
                              encoding="ascii").splitlines())
              }

          overall_before = events(
              "round2-macro-memory-events-before.txt")
          overall_after = events("round2-macro-memory-events-after.txt")
          overall_oom_delta = (
              overall_after.get("oom", 0) - overall_before.get("oom", 0))
          overall_oom_kill_delta = (
