name: Consume canonical ARGUS warm profile
description: One independent warm-profile verifier for shadow and Pages acceptance
inputs:
  owner-artifact-key:
    required: false
    default: ''
  owner-auth:
    required: false
    default: '0'
  owner-origin:
    required: false
    default: ''
  owner-password:
    required: false
    default: ''
  profile-artifact-name:
    required: true
  evidence-artifact-name:
    required: true
  candidate-sha:
    required: true
  public-url:
    required: true
  mode:
    required: true
  expected-version:
    required: false
    default: ''
  expected-backend-version:
    required: false
    default: ''
  expected-backend-sha:
    required: false
    default: ''
  source-run-id:
    required: false
    default: ''
  github-token:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate artifact protection before reading owner content
      shell: bash
      env:
        ARGUS_ACCEPTANCE_OWNER_AUTH: ${{ inputs.owner-auth }}
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
      run: node web/scripts/owner-artifact-envelope.mjs check
    - name: Download profile from the current workflow run
      if: inputs.source-run-id == ''
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.profile-artifact-name }}
        path: ${{ inputs.owner-auth == '1' && 'artifacts/protected-profile' || 'artifacts/warm-seed' }}
    - name: Download profile from an explicit Pages workflow run
      if: inputs.source-run-id != ''
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.profile-artifact-name }}
        path: ${{ inputs.owner-auth == '1' && 'artifacts/protected-profile' || 'artifacts/warm-seed' }}
        run-id: ${{ inputs.source-run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Authenticate and restore the complete owner profile
      if: inputs.owner-auth == '1'
      shell: bash
      env:
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
        ARTIFACT_SHA: ${{ inputs.candidate-sha }}
        ARTIFACT_SOURCE_RUN: ${{ inputs.source-run-id || github.run_id }}
      run: node web/scripts/owner-artifact-envelope.mjs unseal artifacts/protected-profile artifacts/warm-seed profile "$ARTIFACT_SHA" "$ARTIFACT_SOURCE_RUN"
    - id: consume
      name: Validate, reopen, and exercise the downloaded warm profile
      continue-on-error: true
      shell: bash
      working-directory: web
      env:
        ARGUS_ACCEPTANCE_OWNER_AUTH: ${{ inputs.owner-auth }}
        ARGUS_ACCEPTANCE_OWNER_ORIGIN: ${{ inputs.owner-origin }}
        ARGUS_ACCEPTANCE_OWNER_PASSWORD: ${{ inputs.owner-password }}
        ARGUS_ACCEPTANCE_MODE: ${{ inputs.mode }}
        ARGUS_EXPECTED_SHA: ${{ inputs.candidate-sha }}
        ARGUS_EXPECTED_VERSION: ${{ inputs.expected-version }}
        ARGUS_EXPECTED_BACKEND_VERSION: ${{ inputs.expected-backend-version }}
        ARGUS_EXPECTED_BACKEND_SHA: ${{ inputs.expected-backend-sha }}
        ARGUS_PUBLIC_URL: ${{ inputs.public-url }}
        ARGUS_WARM_PROFILE_DIR: ../artifacts/warm-seed
        ARGUS_ACCEPTANCE_OUT: ../artifacts/warm-profile-consumer-evidence
      run: |
        node scripts/warm-profile-contract.mjs validate \
          "$ARGUS_WARM_PROFILE_DIR" "$ARGUS_EXPECTED_SHA"
        node scripts/public-market-acceptance.mjs
    - id: protect_evidence
      name: Seal owner consumer evidence for artifact transport
      if: always() && inputs.owner-auth == '1' && hashFiles('artifacts/warm-profile-consumer-evidence/owner-artifacts-safe.json') != ''
      shell: bash
      env:
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
        ARTIFACT_SHA: ${{ inputs.candidate-sha }}
      run: node web/scripts/owner-artifact-envelope.mjs seal artifacts/warm-profile-consumer-evidence artifacts/protected-consumer-evidence consumer-evidence "$ARTIFACT_SHA" "$GITHUB_RUN_ID"
    - name: Publish bounded consumer evidence
      if: always() && (inputs.owner-auth == '0' || steps.protect_evidence.outcome == 'success')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: ${{ inputs.owner-auth == '1' && 'artifacts/protected-consumer-evidence' || 'artifacts/warm-profile-consumer-evidence' }}
        if-no-files-found: error
        retention-days: 30
    - name: Fail closed after publishing diagnostics
      if: steps.consume.outcome == 'failure'
      shell: bash
      run: exit 1
