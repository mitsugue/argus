name: Produce canonical ARGUS warm profile
description: One production-equivalent seed implementation for shadow and Pages
inputs:
  candidate-sha:
    required: true
  public-url:
    required: true
  profile-artifact-name:
    required: true
  evidence-artifact-name:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: web
    - name: Install pinned public-acceptance browser
      shell: bash
      working-directory: web
      run: |
        npm install --no-save --no-package-lock playwright@1.55.0
        npx playwright install --with-deps chromium
    - id: seed
      name: Execute shared production-equivalent warm-profile seed
      continue-on-error: true
      shell: bash
      working-directory: web
      env:
        ARGUS_EXPECTED_SHA: ${{ inputs.candidate-sha }}
        ARGUS_PUBLIC_URL: ${{ inputs.public-url }}
        ARGUS_WARM_PROFILE_DIR: ../artifacts/market-warm-profile
        ARGUS_ACCEPTANCE_OUT: ../artifacts/warm-profile-seed-evidence
      run: bash scripts/run-warm-profile-seed.sh
    - name: Publish bounded seed evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: artifacts/warm-profile-seed-evidence
        if-no-files-found: error
        retention-days: 30
    - name: Fail closed after publishing diagnostics
      if: steps.seed.outcome == 'failure'
      shell: bash
      run: exit 1
    - name: Publish canonical warm profile
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.profile-artifact-name }}
        path: artifacts/market-warm-profile
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
