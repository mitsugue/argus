name: Produce canonical ARGUS warm profile
description: One production-equivalent seed implementation for shadow and Pages
inputs:
  owner-artifact-key:
    required: false
    default: ''
  owner-auth:
    required: false
    default: '0'
  owner-origin:
    required: false
    default: ''
  owner-password:
    required: false
    default: ''
  candidate-sha:
    required: true
  public-url:
    required: true
  profile-artifact-name:
    required: true
  evidence-artifact-name:
    required: true
  enforce-public-candidate-identity:
    required: false
    default: 'false'
  expected-product-version:
    required: false
    default: ''
  expected-frontend-version:
    required: false
    default: ''
  expected-backend-version:
    required: false
    default: ''
  expected-backend-sha:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate artifact protection before reading owner content
      shell: bash
      env:
        ARGUS_ACCEPTANCE_OWNER_AUTH: ${{ inputs.owner-auth }}
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
      run: node web/scripts/owner-artifact-envelope.mjs check
    - id: seed
      name: Execute shared production-equivalent warm-profile seed
      continue-on-error: true
      shell: bash
      working-directory: web
      env:
        ARGUS_ACCEPTANCE_OWNER_AUTH: ${{ inputs.owner-auth }}
        ARGUS_ACCEPTANCE_OWNER_ORIGIN: ${{ inputs.owner-origin }}
        ARGUS_ACCEPTANCE_OWNER_PASSWORD: ${{ inputs.owner-password }}
        ARGUS_EXPECTED_SHA: ${{ inputs.candidate-sha }}
        ARGUS_EXPECTED_VERSION: ${{ inputs.expected-frontend-version }}
        ARGUS_EXPECTED_PRODUCT_VERSION: ${{ inputs.expected-product-version }}
        ARGUS_EXPECTED_BACKEND_VERSION: ${{ inputs.expected-backend-version }}
        ARGUS_EXPECTED_BACKEND_SHA: ${{ inputs.expected-backend-sha }}
        ARGUS_REQUIRE_LIVE_CANDIDATE: ${{ inputs.enforce-public-candidate-identity }}
        ARGUS_PUBLIC_URL: ${{ inputs.public-url }}
        ARGUS_WARM_PROFILE_DIR: ../artifacts/market-warm-profile
        ARGUS_ACCEPTANCE_OUT: ../artifacts/warm-profile-seed-evidence
      run: bash scripts/run-warm-profile-seed.sh
    - id: protect_evidence
      name: Seal owner seed evidence for artifact transport
      if: always() && inputs.owner-auth == '1' && hashFiles('artifacts/warm-profile-seed-evidence/owner-artifacts-safe.json') != ''
      shell: bash
      env:
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
        ARTIFACT_SHA: ${{ inputs.candidate-sha }}
      run: node web/scripts/owner-artifact-envelope.mjs seal artifacts/warm-profile-seed-evidence artifacts/protected-seed-evidence seed-evidence "$ARTIFACT_SHA" "$GITHUB_RUN_ID"
    - name: Publish bounded seed evidence
      if: always() && (inputs.owner-auth == '0' || steps.protect_evidence.outcome == 'success')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: ${{ inputs.owner-auth == '1' && 'artifacts/protected-seed-evidence' || 'artifacts/warm-profile-seed-evidence' }}
        if-no-files-found: error
        retention-days: 30
    - name: Fail closed after publishing diagnostics
      if: steps.seed.outcome == 'failure'
      shell: bash
      run: exit 1
    - id: protect_profile
      name: Seal the complete canonical owner profile
      if: inputs.owner-auth == '1'
      shell: bash
      env:
        ARGUS_OWNER_ARTIFACT_KEY: ${{ inputs.owner-artifact-key }}
        ARTIFACT_SHA: ${{ inputs.candidate-sha }}
      run: node web/scripts/owner-artifact-envelope.mjs seal artifacts/market-warm-profile artifacts/protected-profile profile "$ARTIFACT_SHA" "$GITHUB_RUN_ID"
    - name: Publish canonical warm profile
      if: success() && (inputs.owner-auth == '0' || steps.protect_profile.outcome == 'success')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.profile-artifact-name }}
        path: ${{ inputs.owner-auth == '1' && 'artifacts/protected-profile' || 'artifacts/market-warm-profile' }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
